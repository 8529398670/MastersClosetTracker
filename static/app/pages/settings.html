<!doctype html>
<html lang="en">
<head>

<title>Settings — Master's Closet</title>
<link rel="stylesheet" href="/app/css/app.css">
</head>
<body>
<main class="card wide">
  <div class="row between">
    <h1>⚙ Settings</h1>
    <a class="btn ghost small" href="/admin">← Back</a>

  </div>
</main>

<script src="/app/js/mct-api.js"></script>
